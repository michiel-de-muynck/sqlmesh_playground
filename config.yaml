gateways:
    local:
        connection:
            type: duckdb
            catalogs:
                persistent: 'local.duckdb'
                ephemeral: ':memory:'
        state_connection:
            type: postgres
            host: db
            user: postgres
            password: postgres
            port: 5432
            database: postgres

default_gateway: local

model_defaults:
    dialect: duckdb
    cron: "@hourly"
    start: "2025-01-01 00:00"
